name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Versionsnummer festlegen
        id: version
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (Code ${GITHUB_RUN_NUMBER})"

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Signaturschlüssel bereitstellen
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Ohne festen Schlüssel lässt sich kein Update über eine bestehende
          # Installation legen. Deshalb bricht der Build bei jedem Fehler ab,
          # statt still eine Debug-APK zu bauen.
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signatur-Secrets fehlen (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS)."
            exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          if ! printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 --decode > "$KS"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 ist kein gültiges Base64."
            exit 1
          fi
          if ! keytool -J-Duser.language=en -list -keystore "$KS" -storepass "$KEY_PASS" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            cat "$RUNNER_TEMP/ks.txt"
            echo "::error::Keystore nicht lesbar - ANDROID_KEYSTORE_PASSWORD passt nicht."
            exit 1
          fi
          if ! grep -qi "^$KEY_ALIAS,.*PrivateKeyEntry" "$RUNNER_TEMP/ks.txt"; then
            echo "Gefundene Einträge:"
            grep -i "PrivateKeyEntry" "$RUNNER_TEMP/ks.txt" | cut -d, -f1 || true
            echo "::error::ANDROID_KEY_ALIAS passt zu keinem Schlüssel im Keystore."
            exit 1
          fi
          echo "Keystore in Ordnung, Alias: $KEY_ALIAS"
          {
            echo "ANDROID_KEYSTORE_FILE=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEY_PASS"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Datenbank pruefen
        run: python3 tools/pruefe-datenbank.py

      - name: APK bauen
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Signatur prüfen
        continue-on-error: true
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256"

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             out/meine-termine-${{ steps.version.outputs.name }}.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: meine-termine-${{ steps.version.outputs.name }}
          path: out/*.apk
          retention-days: 90

      - name: Änderungstext festlegen
        id: changes
        run: |
          # Nur die Betreffzeile des Commits, ohne Anhaenge wie Co-Authored-By.
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Version ${{ steps.version.outputs.name }}
          body: |
            Automatisch gebaut aus dem letzten Push auf main.

            Änderungen in diesem Build:
            ${{ steps.changes.outputs.subject }}
          files: out/*.apk
          make_latest: true
