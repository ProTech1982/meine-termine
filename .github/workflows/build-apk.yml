name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Versionsnummer festlegen
        id: version
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (Code ${GITHUB_RUN_NUMBER})"

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Das Secret KEYSTORE_B64 fehlt. Ohne festen Schlüssel lässt sich kein Update über eine bestehende Installation legen."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/meine-termine.jks

      - name: Datenbank pruefen
        run: python3 tools/pruefe-datenbank.py

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: meinetermine
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Signatur prüfen
        continue-on-error: true
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256"

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             out/meine-termine-${{ steps.version.outputs.name }}.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: meine-termine-${{ steps.version.outputs.name }}
          path: out/*.apk
          retention-days: 90

      - name: Änderungstext festlegen
        id: changes
        run: |
          # Nur die Betreffzeile des Commits, ohne Anhaenge wie Co-Authored-By.
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Version ${{ steps.version.outputs.name }}
          body: |
            Automatisch gebaut aus dem letzten Push auf main.

            Änderungen in diesem Build:
            ${{ steps.changes.outputs.subject }}
          files: out/*.apk
          make_latest: true
